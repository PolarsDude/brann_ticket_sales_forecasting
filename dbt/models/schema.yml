version: 2

sources:
  - name: raw
    description: Raw data from web scraping in DuckDB
    schema: main
    tables:
      - name: raw_eliteserien_results
        description: Raw Eliteserien match results (season, date, matchday, home_team, away_team, result, snapshot_at, ingested_at)
      - name: raw_eliteserien_goal_scorers
        description: Raw goal-scoring events from Eliteserien match reports
      - name: raw_match_statistics
        description: Raw match statistics from Eliteserien match reports, such as possession, shots, and fouls, xg etc.

models:
  - name: dim_teams
    description: "Canonical team names available in each Eliteserien season. Use it to resolve partial names such as 'Rosenborg' to 'Rosenborg BK'."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: team_name
        description: "Canonical team name used by fct_matches and fct_league_standings"

  - name: fct_matches
    description: "One row per match per round. Contains match results with parsed goals and winner information."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: date
        description: "The date when the match was played"
      - name: matchday
        description: "The round number (matchday) in the season"
      - name: home_team
        description: "Name of the home team"
      - name: away_team
        description: "Name of the away team"
      - name: result
        description: "Match result as string in format 'X:Y' (e.g. '2:1')"
      - name: home_goals
        description: "Number of goals scored by the home team"
      - name: away_goals
        description: "Number of goals scored by the away team"
      - name: winner
        description: "Match winner: 'home_team' if home team won, 'away_team' if away team won, 'draw' for ties"
      - name: snapshot_at
        description: "Timestamp when the data was fetched from the source"
      - name: ingested_at
        description: "Timestamp when the data was loaded into the DuckDB database"
  
  - name: fct_league_standings
    description: "League standings after each matchday. One row per team per round showing cumulative statistics."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season. Standings reset for each season."
      - name: matchday
        description: "The round number (matchday) in the season"
      - name: team
        description: "Team name"
      - name: total_points
        description: "Cumulative points earned up to and including this matchday"
      - name: total_goals_for
        description: "Cumulative goals scored up to and including this matchday"
      - name: total_goals_against
        description: "Cumulative goals conceded up to and including this matchday"
      - name: goal_difference
        description: "Cumulative goal difference (goals_for - goals_against)"
      - name: position
        description: "Team's position in the league table after this matchday"

  - name: fct_goal_scorers
    description: "One row per recorded goal in an Eliteserien match."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: date
        description: "Date of the match"
      - name: matchday
        description: "The round number in the season"
      - name: home_team
        description: "Home team"
      - name: away_team
        description: "Away team"
      - name: result
        description: "Final score of the match"
      - name: scorer_team
        description: "Team credited with the goal"
      - name: scorer_name
        description: "Player credited with the goal"
      - name: ingested_at
        description: "Timestamp when the record was loaded into DuckDB"

  - name: fct_match_statistics
    description: "One row per match with the raw event-by-event match statistics collected from SofaScore, including possession, shots, expected goals, fouls, corners, and other match-level metrics. This table is used as the detailed statistical layer before downstream analysis or aggregation."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: date
        description: "Date when the match was played"
      - name: matchday
        description: "The round number in the season"
      - name: home_team
        description: "Home team name"
      - name: away_team
        description: "Away team name"
      - name: result
        description: "Final score of the match in the form 'X:Y'"
      - name: home_xg_all
        description: "Expected goals for the home team across the full match"
      - name: away_xg_all
        description: "Expected goals for the away team across the full match"
      - name: home_xg_1st
        description: "Expected goals for the home team in the first half"
      - name: away_xg_1st
        description: "Expected goals for the away team in the first half"
      - name: home_xg_2nd
        description: "Expected goals for the home team in the second half"
      - name: away_xg_2nd
        description: "Expected goals for the away team in the second half"
      - name: possession_home
        description: "Home team's possession share in percent"
      - name: possession_away
        description: "Away team's possession share in percent"
      - name: shots_home
        description: "Total shots taken by the home team"
      - name: shots_away
        description: "Total shots taken by the away team"
      - name: fouls_home
        description: "Number of fouls committed by the home team"
      - name: fouls_away
        description: "Number of fouls committed by the away team"
      - name: ingested_at
        description: "Timestamp when the data was loaded into DuckDB"

 