version: 2

sources:
  - name: raw
    description: Raw data from web scraping in DuckDB
    schema: main
    tables:
      - name: raw_eliteserien_results
        description: Raw Eliteserien match results (season, date, matchday, home_team, away_team, result, snapshot_at, ingested_at)
      - name: raw_eliterserien_goal_contributions_2021
        description: Raw goal-contribution events scraped from Transfermarkt match reports for the 2021 Eliteserien season.
      - name: raw_eliterserien_goal_contributions_2022
        description: Raw goal-contribution events scraped from Transfermarkt match reports for the 2022 Eliteserien season.
      - name: raw_eliterserien_goal_contributions_2023
        description: Raw goal-contribution events scraped from Transfermarkt match reports for the 2023 Eliteserien season.
      - name: raw_eliterserien_goal_contributions_2024
        description: Raw goal-contribution events scraped from Transfermarkt match reports for the 2024 Eliteserien season.
      - name: raw_eliterserien_goal_contributions_2025
        description: Raw goal-contribution events scraped from Transfermarkt match reports for the 2025 Eliteserien season.
      - name: raw_eliterserien_goal_contributions_2026
        description: Raw goal-contribution events scraped from Transfermarkt match reports for the 2026 Eliteserien season.
      - name: raw_eliterserien_lineups_2021
        description: Raw FotMob starting-lineup, substitute, and substitution records for the 2021 Eliteserien season.
      - name: raw_eliterserien_lineups_2022
        description: Raw FotMob starting-lineup, substitute, and substitution records for the 2022 Eliteserien season.
      - name: raw_eliterserien_lineups_2023
        description: Raw FotMob starting-lineup, substitute, and substitution records for the 2023 Eliteserien season.
      - name: raw_eliterserien_lineups_2024
        description: Raw FotMob starting-lineup, substitute, and substitution records for the 2024 Eliteserien season.
      - name: raw_eliterserien_lineups_2025
        description: Raw FotMob starting-lineup, substitute, and substitution records for the 2025 Eliteserien season.
      - name: raw_eliterserien_lineups_2026
        description: Raw FotMob starting-lineup, substitute, and substitution records for the 2026 Eliteserien season.
      
models:
  - name: dim_teams
    description: "Canonical team names available in each Eliteserien season. Use it to resolve partial names such as 'Rosenborg' to 'Rosenborg BK'."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: team_name
        description: "Canonical team name used by fct_matches and fct_league_standings"

  - name: fct_matches
    description: "One row per match per round. Contains match results with parsed goals and winner information."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: date
        description: "The date when the match was played"
      - name: matchday
        description: "The round number (matchday) in the season"
      - name: home_team
        description: "Name of the home team"
      - name: away_team
        description: "Name of the away team"
      - name: result
        description: "Match result as string in format 'X:Y' (e.g. '2:1')"
      - name: home_goals
        description: "Number of goals scored by the home team"
      - name: away_goals
        description: "Number of goals scored by the away team"
      - name: winner
        description: "Match winner: 'home_team' if home team won, 'away_team' if away team won, 'draw' for ties"
      - name: snapshot_at
        description: "Timestamp when the data was fetched from the source"
      - name: ingested_at
        description: "Timestamp when the data was loaded into the DuckDB database"
  
  - name: fct_league_standings
    description: "League standings after each matchday. One row per team per round showing cumulative statistics."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season. Standings reset for each season."
      - name: matchday
        description: "The round number (matchday) in the season"
      - name: team
        description: "Team name"
      - name: total_points
        description: "Cumulative points earned up to and including this matchday"
      - name: total_goals_for
        description: "Cumulative goals scored up to and including this matchday"
      - name: total_goals_against
        description: "Cumulative goals conceded up to and including this matchday"
      - name: goal_difference
        description: "Cumulative goal difference (goals_for - goals_against)"
      - name: position
        description: "Team's position in the league table after this matchday"

  - name: fct_goal_contributions
    description: "One row per goal event in an Eliteserien match, including the scorer and any recorded assist. Rows may repeat at the season, date, home_team, away_team, scorer_name level when a player scores multiple times in a match, including scoring both a regular goal and an own goal. Repeated assist_name values in a match may likewise mean that the player provided multiple assists. These repeated values represent separate goal events and are not necessarily duplicate records."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: date
        description: "Date when the match was played"
      - name: home_team
        description: "Name of the home team"
      - name: away_team
        description: "Name of the away team"
      - name: matchday
        description: "The round number in the season"
      - name: result
        description: "Final match result"
      - name: scorer_name
        description: "Name of the player credited with the goal"
      - name: scorer_player_id
        description: "Transfermarkt player ID of the goal scorer, when available"
      - name: assist_name
        description: "Name of the player credited with the assist, when available"
      - name: assist_player_id
        description: "Transfermarkt player ID of the assister, when available"
      - name: scorer_team
        description: "Team credited with scoring the goal"
      - name: home_or_away
        description: "Whether the goal was scored by the home or away team"
      - name: score
        description: "Score shown for the goal event in the match report"
      - name: report_url
        description: "URL of the Transfermarkt match report used as the source"
      - name: snapshot_at
        description: "Timestamp when the source data was scraped"
      - name: ingested_at
        description: "Timestamp when the record was loaded into DuckDB"

  - name: fct_lineups
    description: "One row per player listed in a FotMob match lineup, including starters and substitutes. Substitution rows identify the player entering or leaving, their counterpart, and the substitution time."
    columns:
      - name: season
        description: "Calendar year of the Eliteserien season"
      - name: date
        description: "Date when the match was played"
      - name: matchday
        description: "The round number in the season"
      - name: home_team
        description: "Name of the home team"
      - name: away_team
        description: "Name of the away team"
      - name: report_url
        description: "URL of the FotMob match report used as the source"
      - name: team_name
        description: "Team the player was listed for"
      - name: home_or_away
        description: "Whether the player's team was playing at home or away"
      - name: formation
        description: "Team formation shown in the match report, when available"
      - name: player_name
        description: "Player's name"
      - name: player_id
        description: "FotMob player ID, when available"
      - name: shirt_number
        description: "Player's shirt number, when available"
      - name: player_status
        description: "Whether the player was listed as a starter or substitute"
      - name: position
        description: "Player's usual position category from FotMob, when available"
      - name: position_source
        description: "Source used to determine the player's position"
      - name: formation_top
        description: "Player's vertical position on the formation graphic, as a percentage"
      - name: formation_left
        description: "Player's horizontal position on the formation graphic, as a percentage"
      - name: substitute_used
        description: "Whether a listed substitute was used; null for starters"
      - name: substitution_type
        description: "Whether the player entered ('in') or left ('out') during a substitution"
      - name: substitution_time
        description: "Match time of the substitution, including added time when provided by FotMob"
      - name: substitution_partner_name
        description: "Name of the player entering or leaving in exchange for this player"
      - name: substitution_partner_id
        description: "FotMob player ID of the substitution partner"
      - name: result
        description: "Final match result"
      - name: snapshot_at
        description: "Timestamp when the source data was scraped"
      - name: ingested_at
        description: "Timestamp when the record was loaded into DuckDB"

 